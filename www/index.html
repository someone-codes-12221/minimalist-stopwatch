<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <title>Chrono</title>
  <style>
    :root {
      --bg: #000000;
      --surface: #111113;
      --text: #f5f5f7;
      --muted: #6e6e73;
      --accent: #ffffff;
      --green: #30d158;
      --red: #ff453a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: calc(env(safe-area-inset-top) + 28px) 24px calc(env(safe-area-inset-bottom) + 28px);
      overflow: hidden;
    }

    /* Status Pill */
    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--muted);
      transition: background 0.3s ease, box-shadow 0.3s ease;
    }

    body.running .dot {
      background: var(--green);
      box-shadow: 0 0 10px var(--green);
      animation: pulse 1.4s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.8); }
    }

    /* Main Dial */
    .dial-wrap {
      position: relative;
      width: 270px;
      height: 270px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.18s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .dial-wrap:active {
      transform: scale(0.96);
    }

    .glow {
      position: absolute;
      inset: 24px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,0.08) 0%, transparent 70%);
      opacity: 0;
      transition: opacity 0.4s ease;
      pointer-events: none;
    }

    body.running .glow {
      opacity: 1;
    }

    svg.ring {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
    }

    .ring-track {
      fill: none;
      stroke: #1c1c1e;
      stroke-width: 3;
    }

    .ring-progress {
      fill: none;
      stroke: var(--accent);
      stroke-width: 3;
      stroke-linecap: round;
      stroke-dasharray: 779.11;
      stroke-dashoffset: 779.11;
      transition: stroke 0.3s ease;
    }

    .time-box {
      text-align: center;
      z-index: 2;
    }

    .time {
      font-size: 50px;
      font-weight: 300;
      letter-spacing: -0.02em;
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }

    .ms {
      font-size: 24px;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      margin-top: 6px;
    }

    .hint {
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #3a3a3c;
      margin-top: 14px;
    }

    /* Laps List */
    .laps {
      width: 100%;
      max-width: 360px;
      flex: 1;
      margin: 20px 0;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      scrollbar-width: none;
    }
    .laps::-webkit-scrollbar { display: none; }

    .lap-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      background: var(--surface);
      border-radius: 14px;
      font-size: 14px;
      font-variant-numeric: tabular-nums;
      animation: slideIn 0.28s cubic-bezier(0.22, 1, 0.36, 1);
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-10px) scale(0.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .lap-num { color: var(--muted); font-size: 13px; }
    .lap-delta { font-weight: 500; }
    .lap-total { color: var(--muted); font-size: 13px; }

    .lap-row.fastest .lap-delta { color: var(--green); }
    .lap-row.slowest .lap-delta { color: var(--red); }

    /* Controls */
    .controls {
      width: 100%;
      max-width: 360px;
      display: flex;
      gap: 14px;
    }

    button {
      flex: 1;
      height: 54px;
      border-radius: 999px;
      border: none;
      font-size: 15px;
      font-weight: 500;
      letter-spacing: 0.02em;
      cursor: pointer;
      transition: transform 0.15s ease, opacity 0.2s ease, background 0.2s ease;
    }

    button:active { transform: scale(0.95); }
    button:disabled { opacity: 0.3; pointer-events: none; }

    .btn-secondary {
      background: var(--surface);
      color: var(--text);
    }

    .btn-primary {
      background: var(--accent);
      color: #000000;
    }

    body.running .btn-primary {
      background: #1c1c1e;
      color: var(--red);
    }
  </style>
</head>
<body>
  <div class="status">
    <span class="dot"></span>
    <span id="statusText">Ready</span>
  </div>

  <div class="dial-wrap" id="dial">
    <div class="glow"></div>
    <svg class="ring" viewBox="0 0 260 260">
      <circle class="ring-track" cx="130" cy="130" r="124"></circle>
      <circle class="ring-progress" id="ringProgress" cx="130" cy="130" r="124"></circle>
    </svg>
    <div class="time-box">
      <div class="time" id="mainTime">00:00</div>
      <div class="ms" id="msTime">.00</div>
      <div class="hint" id="hintText">Tap to start</div>
    </div>
  </div>

  <div class="laps" id="lapsList"></div>

  <div class="controls">
    <button class="btn-secondary" id="secondaryBtn" disabled>Reset</button>
    <button class="btn-primary" id="primaryBtn">Start</button>
  </div>

  <script>
    const mainTimeEl = document.getElementById('mainTime');
    const msTimeEl = document.getElementById('msTime');
    const statusTextEl = document.getElementById('statusText');
    const hintTextEl = document.getElementById('hintText');
    const ringProgress = document.getElementById('ringProgress');
    const lapsList = document.getElementById('lapsList');
    const primaryBtn = document.getElementById('primaryBtn');
    const secondaryBtn = document.getElementById('secondaryBtn');
    const dial = document.getElementById('dial');

    const CIRCUMFERENCE = 2 * Math.PI * 124;
    let running = false;
    let startTime = 0;
    let elapsed = 0;
    let lastLapTotal = 0;
    let laps = [];
    let rafId = null;
    let wakeLock = null;

    function vibrate(ms = 12) {
      if (navigator.vibrate) navigator.vibrate(ms);
    }

    async function setWakeLock(active) {
      try {
        if (active && 'wakeLock' in navigator) {
          wakeLock = await navigator.wakeLock.request('screen');
        } else if (!active && wakeLock) {
          await wakeLock.release();
          wakeLock = null;
        }
      } catch (_) {}
    }

    function formatParts(ms) {
      const totalSec = Math.floor(ms / 1000);
      const mins = Math.floor(totalSec / 60);
      const secs = totalSec % 60;
      const centis = Math.floor((ms % 1000) / 10);
      return {
        main: `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`,
        ms: `.${String(centis).padStart(2, '0')}`
      };
    }

    function formatFull(ms) {
      const p = formatParts(ms);
      return p.main + p.ms;
    }

    function renderTime(ms) {
      const p = formatParts(ms);
      mainTimeEl.textContent = p.main;
      msTimeEl.textContent = p.ms;
      const progress = (ms % 60000) / 60000;
      ringProgress.style.strokeDashoffset = CIRCUMFERENCE * (1 - progress);
    }

    function tick() {
      if (!running) return;
      elapsed = performance.now() - startTime;
      renderTime(elapsed);
      rafId = requestAnimationFrame(tick);
    }

    function toggle() {
      vibrate(14);
      if (!running) {
        running = true;
        startTime = performance.now() - elapsed;
        document.body.classList.add('running');
        statusTextEl.textContent = 'Running';
        hintTextEl.textContent = 'Tap to pause';
        primaryBtn.textContent = 'Pause';
        secondaryBtn.textContent = 'Lap';
        secondaryBtn.disabled = false;
        setWakeLock(true);
        tick();
      } else {
        running = false;
        cancelAnimationFrame(rafId);
        document.body.classList.remove('running');
        statusTextEl.textContent = 'Paused';
        hintTextEl.textContent = 'Tap to resume';
        primaryBtn.textContent = 'Resume';
        secondaryBtn.textContent = 'Reset';
        setWakeLock(false);
      }
    }

    function renderLaps() {
      lapsList.innerHTML = '';
      if (laps.length === 0) return;

      let minDelta = Infinity, maxDelta = -Infinity;
      if (laps.length >= 2) {
        laps.forEach(l => {
          if (l.delta < minDelta) minDelta = l.delta;
          if (l.delta > maxDelta) maxDelta = l.delta;
        });
      }

      [...laps].reverse().forEach((lap, idx) => {
        const num = laps.length - idx;
        const row = document.createElement('div');
        row.className = 'lap-row';
        if (laps.length >= 2) {
          if (lap.delta === minDelta) row.classList.add('fastest');
          else if (lap.delta === maxDelta) row.classList.add('slowest');
        }
        row.innerHTML = `
          <span class="lap-num">Lap ${String(num).padStart(2, '0')}</span>
          <span class="lap-delta">+${formatFull(lap.delta)}</span>
          <span class="lap-total">${formatFull(lap.total)}</span>
        `;
        lapsList.appendChild(row);
      });
    }

    function handleSecondary() {
      if (running) {
        vibrate(10);
        const delta = elapsed - lastLapTotal;
        lastLapTotal = elapsed;
        laps.push({ delta, total: elapsed });
        renderLaps();
      } else {
        vibrate([10, 30, 10]);
        elapsed = 0;
        lastLapTotal = 0;
        laps = [];
        renderTime(0);
        renderLaps();
        statusTextEl.textContent = 'Ready';
        hintTextEl.textContent = 'Tap to start';
        primaryBtn.textContent = 'Start';
        secondaryBtn.textContent = 'Reset';
        secondaryBtn.disabled = true;
      }
    }

    dial.addEventListener('click', toggle);
    primaryBtn.addEventListener('click', toggle);
    secondaryBtn.addEventListener('click', handleSecondary);
  </script>
</body>
</html>
