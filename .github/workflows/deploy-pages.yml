name: Deploy web preview

on:
  push:
    branches: ["main"]
    paths:
      - "www/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "github-pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: https://someone-codes-12221.github.io/minimalist-stopwatch/
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Verify website entry point
        run: test -f www/index.html

      - name: Upload website files
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages
          path: www

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
        with:
          artifact_name: github-pages

      - name: Retry deployment
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true
        with:
          artifact_name: github-pages

      - name: Final deployment retry
        id: final_deployment_retry
        if: steps.deployment_retry.conclusion == 'failure'
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages

      - name: Publish live site link
        if: success()
        run: |
          echo "## Chrono Obsidian is live" >> "$GITHUB_STEP_SUMMARY"
          echo "[Open the latest deployed site](https://someone-codes-12221.github.io/minimalist-stopwatch/)" >> "$GITHUB_STEP_SUMMARY"
